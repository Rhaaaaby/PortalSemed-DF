<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Portal - São Miguel do Tocantins</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
    <div id="header"></div>

    <!-- CONTEÚDO PRINCIPAL AJUSTADO -->
    <main class="login-main-container">
        <div class="login-card">
            <h2>Acesso ao Portal</h2>
            <div id="login-message" class="message" style="display:none"></div>
            <form id="login-form">
                <div class="input-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="password" placeholder="Digite sua senha" required>
                </div>

                <!-- Botão Entrar com a cor verde-alface -->
                <button type="submit" class="btn-entrar">Entrar</button>

                <a href="recuperar-senha.html" class="link-esqueci">Esqueci minha senha</a>

                <p class="login-access-note">O acesso é criado pela administração do portal.</p>
            </form>
        </div>
    </main>
    <div id="footer"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/include-components.js"></script>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
