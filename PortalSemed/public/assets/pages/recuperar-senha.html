<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - SEMED</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/notifications.css">
</head>
<body>
    <div id="header"></div>

    <main class="login-main-container">
        <div class="login-card">
            <section id="recovery-request">
                <h2>Recuperar Senha</h2>
                <p class="instrucao-recuperar">
                    Digite o e-mail cadastrado. Se ele estiver associado a uma conta, enviaremos um link seguro para redefinir sua senha.
                </p>
                <form id="recovery-request-form">
                    <div class="input-group">
                        <label for="recovery-email">E-mail cadastrado:</label>
                        <input type="email" id="recovery-email" name="email" maxlength="100" required>
                    </div>
                    <button type="submit" class="btn-verde-claro recovery-submit">
                        Enviar Link de Recuperação
                    </button>
                </form>
            </section>

            <section id="recovery-reset" hidden>
                <h2>Definir nova senha</h2>
                <p class="instrucao-recuperar">Escolha uma senha com pelo menos 12 caracteres.</p>
                <form id="recovery-reset-form">
                    <div class="input-group">
                        <label for="new-password">Nova senha:</label>
                        <input type="password" id="new-password" name="password" minlength="12" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirme a nova senha:</label>
                        <input type="password" id="confirm-password" name="confirm_password" minlength="12" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn-verde-claro recovery-submit">
                        Salvar nova senha
                    </button>
                </form>
            </section>

            <div class="recovery-login-link">
                <a href="/login.html">Voltar para o Login</a>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="/assets/js/include-components.js"></script>
    <script src="/assets/js/password-recovery.js"></script>
</body>
</html>
