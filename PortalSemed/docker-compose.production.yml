name: portalsemed-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER in .env.production}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  db-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        export APP_DB_PASSWORD="$$(cat /run/secrets/db_password)"
        psql --host=db --username="$$DB_ADMIN_USER" --dbname="$$DB_NAME" \
          --set=ON_ERROR_STOP=1 \
          --set=db_admin_user="$$DB_ADMIN_USER" \
          --set=db_name="$$DB_NAME" \
          --set=db_user="$$DB_USER" \
          --file=/docker-init/create-app-role.sql
    environment:
      DB_ADMIN_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER in .env.production}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
    secrets:
      - postgres_password
      - db_password
    volumes:
      - ./docker/postgres/create-app-role.sql:/docker-init/create-app-role.sql:ro
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  app:
    image: portalsemed-php:production
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PASS_FILE: /run/secrets/db_password
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env.production}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?Set MAIL_FROM_EMAIL in .env.production}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Portal SEMED}
    secrets:
      - db_password
      - smtp_password
    volumes:
      - portal_uploads:/var/www/portalsemed/public/assets/images/uploads
    networks:
      - database
      - application
    depends_on:
      db-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: portalsemed-nginx:production
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.production
    restart: unless-stopped
    volumes:
      - portal_uploads:/var/www/portalsemed/public/assets/images/uploads:ro
    networks:
      - application
      - edge
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=755,size=32m
      - /run:mode=755,size=16m
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE in .env.production}
  postgres_password:
    file: ${DB_ADMIN_PASSWORD_FILE:?Set DB_ADMIN_PASSWORD_FILE in .env.production}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:?Set SMTP_PASSWORD_FILE in .env.production}

volumes:
  postgres_data:
  portal_uploads:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  application:
  edge:
